[project]
name = "cert-nlq"
version = "0.1.0"
description = "Natural-language to constrained-IR query translator"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Report skip reasons. Two contract tests import private normalisers from the
# provider SDKs on purpose; both SDKs are hard dependencies, so a skip there
# can only mean the path moved -- i.e. the vendor changed what it accepts and
# nothing is checking that claim any more. A silent skip count is exactly how
# that goes unnoticed.
addopts = ["-rs"]

[tool.ruff]
# Pinned, not inherited. With no section here the rule set is whatever the
# installed ruff happens to default to, and that default moves between
# releases — so the same code lints clean on one machine and fails on
# another, and CI has no stable definition of "clean" at all.
target-version = "py313"
# The code is written to wrap at 88. This is the hard limit rather than that
# target: a handful of lines already sit just over it, and reflowing them to
# satisfy a newly-pinned rule would be churn in a diff about lint config.
line-length = 96

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import ordering
    "B",    # likely bugs
    "C4",   # comprehensions
    "UP",   # syntax this Python version supersedes
    "DTZ",  # naive datetimes — a server-local "today" is not every caller's
    "RUF",
]
